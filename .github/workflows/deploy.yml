name: Desplegar a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: Ometre les proves de navegador (només per desplegar una reversió amb el CI en vermell)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Instal·lar Chromium per a les proves de navegador
        if: ${{ !inputs.skip_e2e }}
        run: npx playwright install --with-deps chromium

      - name: Proves de navegador
        if: ${{ !inputs.skip_e2e }}
        run: npm run test:e2e -- --project=chromium --project=mobile

      - name: Comprovar la URL de l'Apps Script
        env:
          AGENDA_API_URL: ${{ vars.AGENDA_API_URL }}
        run: |
          if [ -z "$AGENDA_API_URL" ]; then
            echo "::error::Falta la variable de repositori AGENDA_API_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          if [[ ! "$AGENDA_API_URL" =~ ^https://script\.google\.com/(a/macros/[^/]+|macros)/s/[A-Za-z0-9_-]+/exec$ ]]; then
            echo "::error::AGENDA_API_URL no és una URL d'Apps Script completa. Ha de ser https://script.google.com/macros/s/XXXX/exec (valor actual: $AGENDA_API_URL)."
            exit 1
          fi

      - uses: actions/configure-pages@v6

      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          VITE_AGENDA_API_URL: ${{ vars.AGENDA_API_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
